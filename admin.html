<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniDrama Admin</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:850px;margin:45px auto;padding:22px}.panel{background:#171720;padding:22px;border-radius:15px;margin:18px 0}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea{background:#252530;color:white;border:1px solid #ffffff22;padding:12px;border-radius:8px;font:inherit}.btn{background:#ff315e;color:white;border:0;padding:11px 20px;border-radius:20px;font:inherit;cursor:pointer}.rowitem{padding:12px;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;gap:10px}</style></head><body><header class="topbar"><a class="brand" href="index.html">MiniDrama Admin</a><a href="index.html">← Website</a></header><main class="admin"><p class="eyebrow">CONTROL CENTER</p><h1>Admin Panel</h1><p class="muted">এটি local demo panel. Production-এ Firebase Authentication ও নিরাপদ admin authorization আবশ্যক।</p><section id="login" class="panel"><h2>Admin Login (Demo)</h2><div class="field"><label>Username</label><input id="user" autocomplete="username"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">Login</button><p class="muted">Demo: admin / minidrama-demo</p></section><section id="dashboard" class="panel" hidden><div style="display:flex;justify-content:space-between"><h2>নাটক পরিচালনা</h2><button class="btn" id="logout">Logout</button></div><form id="addForm"><div class="field"><label>নাটকের নাম</label><input name="title" required></div><div class="field"><label>ক্যাটাগরি</label><input name="category" placeholder="রোমান্স" required></div><div class="field"><label>বিবরণ</label><textarea name="description" required></textarea></div><div class="field"><label>Episode video URL</label><input name="url" type="url" placeholder="https://..." required></div><button class="btn">নাটক যোগ করুন</button></form><h3>নাটকের তালিকা</h3><div id="items"></div></section></main><script src="admin.js"></script></body></html>
